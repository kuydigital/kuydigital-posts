<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KUYDIGITAL post</title>
<style>
@font-face{font-family:'Big Shoulders Display';src:url(../brand/fonts/big-shoulders-display-latin-800-normal.woff2) format('woff2');font-weight:800}
@font-face{font-family:'Big Shoulders Display';src:url(../brand/fonts/big-shoulders-display-latin-700-normal.woff2) format('woff2');font-weight:700}
@font-face{font-family:'Instrument Sans';src:url(../brand/fonts/instrument-sans-latin-400-normal.woff2) format('woff2');font-weight:400}
@font-face{font-family:'Instrument Sans';src:url(../brand/fonts/instrument-sans-latin-600-normal.woff2) format('woff2');font-weight:600}
@font-face{font-family:'JetBrains Mono';src:url(../brand/fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2');font-weight:400}
@font-face{font-family:'JetBrains Mono';src:url(../brand/fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2');font-weight:500}

/* KUYDIGITAL tokens (from the KUYDIGITAL design system) */
.paper{--ground:#f3f0e8;--surface:#ffffff;--ink-text:#141414;--ink-muted:#5c5a55;--mark:#000000;--bar:#000000}
.ink{--ground:#121212;--surface:#1d1d1c;--ink-text:#f3f0e8;--ink-muted:#a8a59e;--mark:#ffffff;--bar:#f3f0e8}
:root{--accent:#d9692b;--concrete:#8c8a84;--graphite:#1d1d1c;--paper:#f3f0e8}

html,body{margin:0;background:#121212}
.post{position:relative;width:1080px;height:1350px;box-sizing:border-box;padding:64px;overflow:hidden;background:var(--ground);color:var(--ink-text)}
.kicker{margin:0;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:26px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
.headline{position:absolute;left:64px;right:64px;margin:0;font-family:'Big Shoulders Display',sans-serif;font-weight:800;line-height:.92;letter-spacing:-.01em;color:var(--ink-text);white-space:pre-line}
.headline em{font-style:normal;color:var(--accent)}
.body{position:absolute;left:64px;right:180px;margin:0;font-family:'Instrument Sans',sans-serif;font-weight:400;font-size:34px;line-height:1.4;color:var(--ink-text);white-space:pre-line}
.code{position:absolute;left:64px;right:64px;box-sizing:border-box;padding:32px 40px;background:var(--graphite);color:var(--paper);font-family:'JetBrains Mono',monospace;font-weight:400;font-size:34px;line-height:1.4;white-space:pre-wrap}
.code b{font-weight:400;color:var(--accent)}
.bars{position:absolute;left:64px;bottom:64px;display:flex;align-items:flex-end;gap:48px;height:360px}
.bars i{display:block;width:48px;background:var(--bar)}
.bars i.c{background:var(--concrete)}
.bars i.a{background:var(--accent)}
.mark{position:absolute;right:64px;bottom:64px;width:120px;height:128px;display:block}
</style>
</head>
<body>
<div id="post" class="post"></div>
<script>
// SPEC is injected by render.py:
// {kind: "few-words"|"work"|"build"|"open", kicker, headline, body?, code?}
// In headline, wrap ONE phrase in [[double brackets]] to set it in copper.
const SPEC = /*SPEC*/{};

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function setHeadline(h, text) {
  const parts = String(text).split(/(\[\[.*?\]\])/);
  for (const p of parts) {
    const m = p.match(/^\[\[(.*)\]\]$/);
    if (m) h.appendChild(el('em', null, m[1])); else if (p) h.appendChild(document.createTextNode(p));
  }
}
// shrink a block's font size until it fits its box
function fit(node, startPx, minPx, maxW, maxH) {
  let s = startPx; node.style.fontSize = s + 'px';
  while (s > minPx && (node.scrollWidth > maxW + 1 || node.getBoundingClientRect().height > maxH)) { s -= 2; node.style.fontSize = s + 'px'; }
  return s;
}

async function main() {
await Promise.all(['800 100px "Big Shoulders Display"', '400 30px "Instrument Sans"', '500 26px "JetBrains Mono"', '400 30px "JetBrains Mono"'].map(f => document.fonts.load(f)));
const post = document.getElementById('post');
const kind = SPEC.kind || 'few-words';
const ink = (kind === 'few-words' || kind === 'open');
post.classList.add(ink ? 'ink' : 'paper');
post.appendChild(el('p', 'kicker', SPEC.kicker || ''));

const h = el('h1', 'headline'); setHeadline(h, SPEC.headline || ''); post.appendChild(h);
const W = 952;

if (kind === 'few-words') {
  h.style.top = '300px';
  fit(h, 150, 96, W, 820);
  // centre the quote block in the space above the monogram
  const hh = h.getBoundingClientRect().height; h.style.top = Math.max(150, Math.round((1350 - 200 - hh) / 2) + 40) + 'px';
} else if (kind === 'open') {
  h.style.top = '150px';
  const s = fit(h, 132, 90, W, 520);
  const hb = 150 + h.getBoundingClientRect().height;
  if (SPEC.body) { const b = el('p', 'body', SPEC.body); b.style.top = (hb + 56) + 'px'; b.style.color = 'var(--ink-muted)'; post.appendChild(b); }
} else {
  h.style.top = '150px';
  fit(h, 120, 84, W, kind === 'build' ? 380 : 470);
  let y = 150 + h.getBoundingClientRect().height + 48;
  if (kind === 'build' && SPEC.code) {
    const c = el('div', 'code'); const parts = String(SPEC.code).split(/(\[\[.*?\]\])/);
    for (const p of parts) { const m = p.match(/^\[\[(.*)\]\]$/); if (m) c.appendChild(el('b', null, m[1])); else if (p) c.appendChild(document.createTextNode(p)); }
    c.style.top = y + 'px'; c.style.whiteSpace = 'pre'; post.appendChild(c);
    let cs = 34; while (cs > 24 && c.scrollWidth > c.clientWidth + 1) { cs -= 1; c.style.fontSize = cs + 'px'; }
    if (c.scrollWidth > c.clientWidth + 1) c.style.whiteSpace = 'pre-wrap';
    y += c.getBoundingClientRect().height + 40;
  }
  if (SPEC.body) { const b = el('p', 'body', SPEC.body); b.style.top = y + 'px'; post.appendChild(b); fit(b, 34, 26, 836, Math.max(120, 1350 - 460 - y)); }
  // bar motif, bottom-left; one copper bar unless the headline already uses copper
  const usesCopper = /\[\[/.test(SPEC.headline || '') || /\[\[/.test(SPEC.code || '');
  const bars = el('div', 'bars');
  const heights = [140, 250, 190, 330, 110];
  heights.forEach((ht, i) => { const b = el('i', i % 2 === 0 ? 'c' : ''); if (i === 3 && !usesCopper) b.className = 'a'; b.style.height = ht + 'px'; bars.appendChild(b); });
  post.appendChild(bars);
}
const mark = el('img', 'mark'); mark.alt = 'KUY monogram';
mark.src = ink ? '../brand/monogram-white.svg' : '../brand/monogram-black.svg';
post.appendChild(mark);
await new Promise(r => { if (mark.complete) r(); else { mark.onload = r; mark.onerror = r; } });
document.title = 'ready';
}
main();
</script>
</body>
</html>
