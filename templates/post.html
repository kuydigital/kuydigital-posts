<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KUYDIGITAL post</title>
<style>
@font-face{font-family:'Big Shoulders Display';src:url(../brand/fonts/big-shoulders-display-latin-800-normal.woff2) format('woff2');font-weight:800}
@font-face{font-family:'Big Shoulders Display';src:url(../brand/fonts/big-shoulders-display-latin-700-normal.woff2) format('woff2');font-weight:700}
@font-face{font-family:'Instrument Sans';src:url(../brand/fonts/instrument-sans-latin-400-normal.woff2) format('woff2');font-weight:400}
@font-face{font-family:'Instrument Sans';src:url(../brand/fonts/instrument-sans-latin-600-normal.woff2) format('woff2');font-weight:600}
@font-face{font-family:'JetBrains Mono';src:url(../brand/fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2');font-weight:400}
@font-face{font-family:'JetBrains Mono';src:url(../brand/fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2');font-weight:500}

/* KUYDIGITAL tokens (from the KUYDIGITAL design system) */
.paper{--ground:#f3f0e8;--surface:#ffffff;--ink-text:#141414;--ink-muted:#5c5a55;--rule:#141414}
.ink{--ground:#121212;--surface:#1d1d1c;--ink-text:#f3f0e8;--ink-muted:#a8a59e;--rule:#3a3936}
:root{--accent:#d9692b;--concrete:#8c8a84;--graphite:#1d1d1c;--paper:#f3f0e8}

html,body{margin:0;background:#121212}
*{box-sizing:border-box}
.post{position:relative;width:1080px;height:1350px;padding:64px;overflow:hidden;background:var(--ground);color:var(--ink-text)}
.top{display:flex;justify-content:space-between;gap:32px}
.kicker{margin:0;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:26px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);white-space:nowrap}
.abs{position:absolute;left:64px;right:64px;margin:0}
.headline{font-family:'Big Shoulders Display',sans-serif;font-weight:800;line-height:.92;letter-spacing:-.01em;color:var(--ink-text);white-space:pre-line}
.headline em,.code b,.title em{font-style:normal;color:var(--accent)}
.name{font-family:'Big Shoulders Display',sans-serif;font-weight:800;line-height:.85;letter-spacing:-.02em;white-space:pre-line}
.body{font-family:'Instrument Sans',sans-serif;font-weight:400;font-size:34px;line-height:1.4;white-space:pre-line}
.muted{color:var(--ink-muted)}
.rule{position:absolute;left:64px;width:160px;height:8px;background:var(--accent)}
.code{padding:32px 40px;background:var(--graphite);color:var(--paper);font-family:'JetBrains Mono',monospace;font-weight:400;font-size:34px;line-height:1.4;white-space:pre}
.code b{font-weight:400}
.photo{position:absolute;left:0;top:0;width:1080px;height:820px;object-fit:cover;display:block}
.art{position:absolute;left:64px;right:64px;top:140px;height:720px;display:flex;align-items:center;justify-content:center}
.art svg{width:100%;height:100%}
.card{border:3px solid var(--rule);background:var(--surface);padding:40px 44px}
.card .src{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:24px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.card .title{margin-top:18px;font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:44px;line-height:1.2}
.card .note{margin-top:24px;font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.credit{position:absolute;left:64px;bottom:72px;font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:.04em;color:var(--ink-muted)}
.mark{position:absolute;right:64px;bottom:64px;width:120px;height:128px;display:block}
</style>
</head>
<body>
<div id="post" class="post"></div>
<script>
// SPEC is injected by render.py. See the docstring in render.py for every kind's fields.
// In headline (and code), wrap ONE phrase in [[double brackets]] to set it in copper.
const SPEC = /*SPEC*/{};

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function rich(node, text) {
  for (const p of String(text || '').split(/(\[\[.*?\]\])/s)) {
    const m = p.match(/^\[\[(.*)\]\]$/s);
    if (m) node.appendChild(el('em', null, m[1])); else if (p) node.appendChild(document.createTextNode(p));
  }
  return node;
}
// shrink a block's font size until it fits its box
function fit(node, startPx, minPx, maxW, maxH) {
  let s = startPx; node.style.fontSize = s + 'px';
  while (s > minPx && (node.scrollWidth > maxW + 1 || node.getBoundingClientRect().height > maxH)) { s -= 2; node.style.fontSize = s + 'px'; }
  return s;
}
const H = n => n.getBoundingClientRect().height;
const W = 952;

async function main() {
await Promise.all(['800 100px "Big Shoulders Display"', '400 30px "Instrument Sans"', '600 30px "Instrument Sans"', '500 26px "JetBrains Mono"', '400 30px "JetBrains Mono"'].map(f => document.fonts.load(f)));
const post = document.getElementById('post');
const kind = SPEC.kind || 'few-words';
const ink = ['few-words', 'open', 'work'].includes(kind);
post.classList.add(ink ? 'ink' : 'paper');
const add = n => (post.appendChild(n), n);
const waits = [];

if (kind === 'photo') {
  const img = add(el('img', 'photo')); img.alt = '';
  waits.push(new Promise(r => { img.onload = r; img.onerror = r; }));
  img.src = '../' + SPEC.photo;
}

// top row: kicker left, optional tag right (photo posts put the kicker under the photo)
if (kind !== 'photo') {
  const top = add(el('div', 'top'));
  const k = top.appendChild(el('p', 'kicker', SPEC.kicker || ''));
  if (kind === 'work' || kind === 'share') k.style.color = kind === 'share' ? 'var(--accent)' : 'var(--ink-muted)';
  if (SPEC.tag) top.appendChild(el('p', 'kicker', SPEC.tag));
}

if (kind === 'work') {
  // Featured project: big project name, copper rule, tagline, one line of body
  const name = add(el('h1', 'name abs', SPEC.name || ''));
  const tag = add(rich(el('p', 'headline abs'), SPEC.headline));
  const body = SPEC.body ? add(el('p', 'body abs muted', SPEC.body)) : null;
  if (body) { body.style.right = '220px'; body.style.fontSize = '30px'; }
  const rule = add(el('div', 'rule'));
  let ns = 260, hs = 80;
  for (;;) {
    fit(name, ns, 120, W, 9999); ns = parseFloat(name.style.fontSize);
    tag.style.fontSize = hs + 'px';
    const total = H(name) + 50 + 8 + 50 + H(tag) + (body ? 40 + H(body) : 0);
    if (total <= 1130 - 200 || (ns <= 120 && hs <= 56)) {
      let y = Math.max(200, 1130 - total);          // bottom-anchor the stack above the monogram line
      name.style.top = y + 'px'; y += H(name) + 50;
      rule.style.top = y + 'px'; y += 58;
      tag.style.top = y + 'px'; y += H(tag) + 40;
      if (body) body.style.top = y + 'px';
      break;
    }
    if (ns > 120) ns -= 10; else hs -= 4;
  }
} else if (kind === 'few-words') {
  const h = add(rich(el('h1', 'headline abs'), SPEC.headline));
  h.style.top = '300px'; fit(h, 150, 96, W, 820);
  h.style.top = Math.max(150, Math.round((1350 - 200 - H(h)) / 2) + 40) + 'px';
} else if (kind === 'funny') {
  // setup in ink, punchline in copper, centred like a quote
  const h = add(el('h1', 'headline abs'));
  h.appendChild(document.createTextNode((SPEC.setup || '') + '\n'));
  h.appendChild(el('em', null, SPEC.punchline || ''));
  h.style.top = '300px'; fit(h, 140, 80, W, 860);
  h.style.top = Math.max(150, Math.round((1350 - 200 - H(h)) / 2) + 20) + 'px';
} else if (kind === 'open') {
  const h = add(rich(el('h1', 'headline abs'), SPEC.headline));
  h.style.top = '150px'; fit(h, 132, 90, W, 520);
  if (SPEC.body) { const b = add(el('p', 'body abs muted', SPEC.body)); b.style.right = '180px'; b.style.top = (150 + H(h) + 56) + 'px'; }
} else if (kind === 'photo') {
  const k = add(el('p', 'kicker abs', SPEC.kicker || '')); k.style.top = '868px';
  const h = add(rich(el('h1', 'headline abs'), SPEC.headline)); h.style.top = '920px'; h.style.right = '220px';
  fit(h, 96, 56, 796, 230);
  if (SPEC.credit) add(el('p', 'credit', SPEC.credit));
} else if (kind === 'illustration') {
  const art = add(el('div', 'art')); art.innerHTML = SPEC.svg || '';
  const h = add(rich(el('h1', 'headline abs'), SPEC.headline)); h.style.top = '920px'; h.style.right = '220px';
  fit(h, 100, 56, 796, 250);
} else if (kind === 'share') {
  const h = add(rich(el('h1', 'headline abs'), SPEC.headline)); h.style.top = '150px';
  fit(h, 120, 72, W, 520);
  const card = add(el('div', 'card abs')); card.style.top = (150 + H(h) + 72) + 'px'; card.style.right = '64px';
  card.appendChild(el('div', 'src', SPEC.source || ''));
  const t = card.appendChild(el('div', 'title', SPEC.title || ''));
  card.appendChild(el('div', 'note', 'Link in the caption'));
  const room = 1130 - 150 - H(h) - 72;
  fit(t, 44, 30, 860, Math.max(120, room - 200));
} else { // build
  const h = add(rich(el('h1', 'headline abs'), SPEC.headline)); h.style.top = '150px';
  fit(h, 120, 84, W, 380);
  let y = 150 + H(h) + 48;
  if (SPEC.code) {
    const c = add(rich(el('div', 'code abs'), SPEC.code)); c.querySelectorAll('em').forEach(e => { const b = el('b', null, e.textContent); e.replaceWith(b); });
    c.style.top = y + 'px';
    let cs = 34; while (cs > 24 && c.scrollWidth > c.clientWidth + 1) { cs -= 1; c.style.fontSize = cs + 'px'; }
    if (c.scrollWidth > c.clientWidth + 1) c.style.whiteSpace = 'pre-wrap';
    y += H(c) + 40;
  }
  if (SPEC.body) { const b = add(el('p', 'body abs', SPEC.body)); b.style.right = '180px'; b.style.top = y + 'px'; fit(b, 34, 26, 836, Math.max(120, 1130 - y)); }
}

const mark = add(el('img', 'mark')); mark.alt = 'KUY monogram';
waits.push(new Promise(r => { mark.onload = r; mark.onerror = r; }));
mark.src = ink ? '../brand/monogram-white.svg' : '../brand/monogram-black.svg';
await Promise.all(waits);
document.title = 'ready';
}
main();
</script>
</body>
</html>
